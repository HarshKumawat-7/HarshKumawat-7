<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Harsh Kumawat's 3D-inspired skill solar system</title>
<desc id="desc">A dark space scene with a glowing central sun and dimensional planets representing programming, frontend, backend, databases, AI, DevOps and system design.</desc>
<defs>
  <radialGradient id="space" cx="50%" cy="48%" r="75%">
    <stop offset="0" stop-color="#14284c"/><stop offset=".55" stop-color="#080f25"/><stop offset="1" stop-color="#030611"/>
  </radialGradient>
  <radialGradient id="sun" cx="32%" cy="27%" r="72%">
    <stop offset="0" stop-color="#fff8d7"/><stop offset=".22" stop-color="#ffd66e"/><stop offset=".55" stop-color="#ff8b43"/><stop offset="1" stop-color="#a92e69"/>
  </radialGradient>
  <radialGradient id="python" cx="30%" cy="25%"><stop stop-color="#b9f1ff"/><stop offset=".4" stop-color="#3999df"/><stop offset="1" stop-color="#142c70"/></radialGradient>
  <radialGradient id="mern" cx="30%" cy="25%"><stop stop-color="#d8ffd5"/><stop offset=".42" stop-color="#52c68b"/><stop offset="1" stop-color="#145342"/></radialGradient>
  <radialGradient id="ai" cx="30%" cy="25%"><stop stop-color="#f3d8ff"/><stop offset=".4" stop-color="#a76bff"/><stop offset="1" stop-color="#44217e"/></radialGradient>
  <radialGradient id="data" cx="30%" cy="25%"><stop stop-color="#fff0c7"/><stop offset=".4" stop-color="#e6a64b"/><stop offset="1" stop-color="#74401e"/></radialGradient>
  <radialGradient id="devops" cx="30%" cy="25%"><stop stop-color="#d2fbff"/><stop offset=".4" stop-color="#39b9c9"/><stop offset="1" stop-color="#15516c"/></radialGradient>
  <radialGradient id="systems" cx="30%" cy="25%"><stop stop-color="#ffd9e9"/><stop offset=".4" stop-color="#e56d9f"/><stop offset="1" stop-color="#70244f"/></radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <linearGradient id="orbit" x1="0" x2="1"><stop stop-color="#4d83c8" stop-opacity=".08"/><stop offset=".5" stop-color="#9ccaff" stop-opacity=".5"/><stop offset="1" stop-color="#4d83c8" stop-opacity=".08"/></linearGradient>
</defs>
<rect width="1400" height="760" rx="28" fill="url(#space)"/>
<!-- star field -->
<g fill="#d9eaff">
 <circle cx="80" cy="85" r="2"/><circle cx="190" cy="180" r="1.5"/><circle cx="315" cy="70" r="1.3"/><circle cx="440" cy="145" r="2"/>
 <circle cx="570" cy="55" r="1.5"/><circle cx="710" cy="105" r="1.2"/><circle cx="870" cy="60" r="2"/><circle cx="1010" cy="145" r="1.4"/>
 <circle cx="1190" cy="75" r="1.8"/><circle cx="1320" cy="180" r="1.2"/><circle cx="90" cy="360" r="1.4"/><circle cx="250" cy="590" r="1.8"/>
 <circle cx="410" cy="680" r="1.2"/><circle cx="620" cy="620" r="1.6"/><circle cx="820" cy="690" r="1.3"/><circle cx="1040" cy="610" r="1.8"/>
 <circle cx="1240" cy="670" r="1.4"/><circle cx="1340" cy="450" r="1.8"/><circle cx="1110" cy="340" r="1.2"/><circle cx="520" cy="340" r="1"/>
</g>
<text x="700" y="62" fill="#f4f7ff" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" letter-spacing="5">THE SKILL UNIVERSE</text>
<text x="700" y="94" fill="#9eb7dc" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" letter-spacing="3">A SOFTWARE ENGINEERING SOLAR SYSTEM</text>
<!-- orbital ellipses -->
<g fill="none" stroke="url(#orbit)" stroke-width="1.6">
 <ellipse cx="700" cy="405" rx="220" ry="105" transform="rotate(-12 700 405)"/>
 <ellipse cx="700" cy="405" rx="350" ry="165" transform="rotate(18 700 405)"/>
 <ellipse cx="700" cy="405" rx="500" ry="230" transform="rotate(-8 700 405)"/>
 <ellipse cx="700" cy="405" rx="620" ry="290" transform="rotate(12 700 405)"/>
</g>
<!-- orbit trails and central sun -->
<circle cx="700" cy="405" r="100" fill="#ff9a55" opacity=".12" filter="url(#glow)"/>
<circle cx="700" cy="405" r="73" fill="url(#sun)" filter="url(#glow)"/>
<ellipse cx="700" cy="405" rx="79" ry="21" fill="none" stroke="#fff0c7" stroke-opacity=".42" stroke-width="2" transform="rotate(-25 700 405)"/>
<text x="700" y="398" fill="#30142b" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">HARSH</text>
<text x="700" y="420" fill="#51223c" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="2">ENGINEERING</text>
<!-- planets -->
<g font-family="Arial,sans-serif" text-anchor="middle">
 <circle cx="480" cy="325" r="34" fill="url(#python)"/><path d="M456 320 Q480 290 507 311" fill="none" stroke="#e6fbff" stroke-opacity=".55" stroke-width="3"/>
 <text x="480" y="379" fill="#eaf4ff" font-size="17" font-weight="700">PYTHON · C++</text><text x="480" y="398" fill="#9db9df" font-size="12">PROGRAMMING</text>
 <circle cx="900" cy="305" r="42" fill="url(#mern)"/><path d="M870 295 Q902 270 933 293" fill="none" stroke="#e1ffec" stroke-opacity=".55" stroke-width="4"/>
 <text x="900" y="366" fill="#eaf4ff" font-size="17" font-weight="700">MERN STACK</text><text x="900" y="385" fill="#9db9df" font-size="12">FULL-STACK</text>
 <circle cx="1020" cy="505" r="38" fill="url(#ai)"/><path d="M992 495 Q1020 467 1048 490" fill="none" stroke="#f4eaff" stroke-opacity=".6" stroke-width="4"/>
 <text x="1020" y="562" fill="#eaf4ff" font-size="17" font-weight="700">AI · RAG · LLMs</text><text x="1020" y="581" fill="#b6a5e6" font-size="12">INTELLIGENT SYSTEMS</text>
 <circle cx="560" cy="545" r="29" fill="url(#data)"/><path d="M539 538 Q560 516 582 535" fill="none" stroke="#fff0cf" stroke-opacity=".6" stroke-width="3"/>
 <text x="560" y="594" fill="#eaf4ff" font-size="16" font-weight="700">DATABASES</text><text x="560" y="612" fill="#d5b98e" font-size="12">MONGO · SQL · REDIS</text>
 <circle cx="1120" cy="225" r="25" fill="url(#devops)"/><path d="M1103 219 Q1120 201 1138 218" fill="none" stroke="#e2fdff" stroke-opacity=".6" stroke-width="3"/>
 <text x="1120" y="268" fill="#eaf4ff" font-size="15" font-weight="700">DEVOPS</text><text x="1120" y="285" fill="#9db9df" font-size="11">DOCKER · LINUX · GIT</text>
 <circle cx="315" cy="490" r="31" fill="url(#systems)"/><path d="M293 483 Q315 459 337 480" fill="none" stroke="#ffe9f2" stroke-opacity=".6" stroke-width="3"/>
 <text x="315" y="540" fill="#eaf4ff" font-size="16" font-weight="700">SYSTEM DESIGN</text><text x="315" y="558" fill="#d6a5bd" font-size="11">DSA · OOP · CS</text>
</g>
<text x="700" y="724" fill="#7893ba" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">LEARN · BUILD · ITERATE</text>
</svg>